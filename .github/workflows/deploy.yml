# main 브랜치에 코드가 올라가면 웹사이트를 자동으로 배포합니다.
#
# 주소: https://huhonduk-glitch.github.io/recovery-coach/
#
# 처음 한 번만 해 주실 일
#   저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꿔 주세요.
#   (아래 configure-pages 단계가 자동으로 켜 주기도 하지만, 안 되면 직접 바꿔 주세요)
#
# 주소가 하위 경로(/recovery-coach)라서 EXPO_BASE_URL 을 넣어 빌드합니다.
# 이 값이 없으면 화면이 하얗게 뜹니다. (app.config.js 참고)

name: 웹사이트 배포

on:
  push:
    branches: [main]
  # Actions 탭에서 직접 눌러 배포할 수도 있습니다
  workflow_dispatch:

# Pages 에 올리는 데 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 새 배포가 시작되면 진행 중이던 것은 끝까지 두고 기다립니다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: Pages 설정
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # 저장소 이름이 주소에 붙으므로 그 경로를 알려 주고 빌드합니다
      - name: 웹 빌드
        run: npm run build:web:pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 배포
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
